site_name: Torchbearers Lore
site_description: Player knowledge for the Torchbearers campaign
repo_url: https://github.com/SageMyrloc/Torch-bearers-lore
theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
plugins:
  - search
