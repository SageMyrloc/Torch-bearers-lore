name: Deploy lore to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pages.txt
      - name: Install site dependencies
        run: pip install -r requirements-pages.txt
      - name: Generate player-safe documentation
        run: python scripts/build-player-lore.py
      - name: Build player site
        run: mkdocs build --strict
      - name: Generate shared GM documentation
        run: python scripts/build-gm-lore.py
      - name: Build hidden GM site
        run: mkdocs build -f mkdocs-gm.yml --strict
      - name: Reduce GM site discoverability
        run: python scripts/harden-gm-site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
